info:
  title: Innovations API @ NHS Innovation Service
  version: 1.0.0
servers:
  - url: https://nhse-${ENV}-innovation-service-innovation-functions.azurewebsites.net/api
openapi: 3.0.3
paths:
  /v1/search:
    get:
      operationId: v1-innovations-search
      description: Get search innovations list
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
        - name: take
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: order
          in: query
          required: false
          schema:
            type: object
            properties: {}
            additionalProperties:
              type: string
              enum:
                - ASC
                - DESC
            default:
              default: DESC
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - csv
        - name: careSettings
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - ACADEMIA
                - ACUTE_TRUSTS_INPATIENT
                - ACUTE_TRUSTS_OUTPATIENT
                - AMBULANCE
                - CARE_HOMES_CARE_SETTING
                - END_LIFE_CARE
                - ICS
                - INDUSTRY
                - LOCAL_AUTHORITY_EDUCATION
                - MENTAL_HEALTH
                - PHARMACY
                - PRIMARY_CARE
                - SOCIAL_CARE
                - THIRD_SECTOR_ORGANISATIONS
                - URGENT_AND_EMERGENCY
                - OTHER
        - name: categories
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - MEDICAL_DEVICE
                - IN_VITRO_DIAGNOSTIC
                - PHARMACEUTICAL
                - DIGITAL
                - AI
                - EDUCATION
                - PPE
                - MODELS_CARE
                - ESTATES_FACILITIES
                - TRAVEL_TRANSPORT
                - FOOD_NUTRITION
                - DATA_MONITORING
                - OTHER
        - name: dateFilters
          in: query
          required: false
          schema:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  enum:
                    - lastAssessmentRequestAt
                    - submittedAt
                    - updatedAt
                    - support.updatedAt
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
              required:
                - field
              additionalProperties: false
        - name: diseasesAndConditions
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100
        - name: engagingOrganisations
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: engagingUnits
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: fields
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - id
                - uniqueId
                - name
                - status
                - statusUpdatedAt
                - groupedStatus
                - submittedAt
                - updatedAt
                - lastAssessmentRequestAt
                - description
                - careSettings
                - categories
                - countryName
                - diseasesAndConditions
                - involvedAACProgrammes
                - keyHealthInequalities
                - mainCategory
                - otherCareSetting
                - otherCategoryDescription
                - postcode
                - areas
                - assessment.id
                - assessment.majorVersion
                - assessment.minorVersion
                - assessment.isExempt
                - assessment.assignedTo
                - assessment.updatedAt
                - assessment.finishedAt
                - assessment.maturityLevel
                - progressAreas
                - engagingOrganisations
                - engagingUnits
                - suggestion.suggestedBy
                - suggestion.suggestedOn
                - support.closeReason
                - support.id
                - support.isShared
                - support.status
                - support.updatedAt
                - support.updatedBy
                - owner.id
                - owner.name
                - owner.companyName
                - owner.email
                - statistics.notifications
                - statistics.tasks
                - statistics.messages
            minItems: 1
        - name: groupedStatuses
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - RECORD_NOT_SHARED
                - AWAITING_NEEDS_ASSESSMENT
                - NEEDS_ASSESSMENT
                - AWAITING_SUPPORT
                - RECEIVING_SUPPORT
                - NO_ACTIVE_SUPPORT
                - AWAITING_NEEDS_REASSESSMENT
                - ARCHIVED
        - name: involvedAACProgrammes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - No
                - Health Innovation Network (HIN)
                - Artificial Intelligence in Health and Care Award
                - Clinical Entrepreneur Programme (CEP)
                - Early Access to Medicines Scheme
                - Innovation and Technology Payment Programme
                - Innovation for Healthcare Inequalities Programme (InHIP)
                - Innovative Devices Access Pathway (IDAP)
                - Innovative Licensing and Access Pathway (ILAP)
                - NHS Innovation Accelerator (NIA)
                - NHS Insights Prioritisation Programme
                - NHS InSites Programme
                - Pathway Transformation Fund
                - Patient Entrepreneur Programme (PEP)
                - Rapid Uptake Products Programme
                - Small Business Research Initiative for Healthcare (SBRI)
                - Test beds
        - name: keyHealthInequalities
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - MATERNITY
                - SEVER_MENTAL_ILLNESS
                - CHRONIC_RESPIRATORY_DISEASE
                - EARLY_CANCER_DIAGNOSIS
                - HYPERTENSION_CASE_FINDING
                - NONE
        - name: locations
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - England
                - Scotland
                - Wales
                - Northern Ireland
                - Based outside UK
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            nullable: true
        - name: areas
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - EMERGING_INFECTIOUS_DISEASES
                - DATA_ANALYTICS_AND_RESEARCH
                - DIGITALISING_SYSTEM
                - HOSPITAL_TO_COMMUNITY
                - IMPROVING_SYSTEM_FLOW
                - PREVENTIVE_CARE
                - SUPPORTING_PEOPLE_HEALTH
                - PATIENT_SAFETY
                - WORKFORCE_RESOURCE_OPTIMISATION
                - NET_ZERO_GREENER_INNOVATION
                - NONE
        - name: maturityLevels
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - DISCOVERY
                - ADVANCED
                - READY
        - name: progressAreas
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - deploymentCount
                - ukcaceCertification
                - dtacCertification
                - evidenceClinicalOrCare
                - evidenceRealWorld
                - assessmentRealWorldValidation
                - evidenceOfImpact
                - assessmentEvidenceProveEfficacy
                - evidenceCostImpact
                - workingProduct
                - carbonReductionPlan
                - htwTerComplete
                - niceGuidanceComplete
                - scProcurementRouteIdentified
      responses:
        "204":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /v1/share-with-organisation/{organisationId}:
    post:
      operationId: v1-innovations-share-with-organisation
      description: Share all user innovations with an organisation
      parameters:
        - name: organisationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /v1/{innovationId}/validate:
    get:
      description: Get validation information.
      operationId: v1-innovations-validate
      parameters:
        - name: innovationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Id of the innovation.
      responses:
        "200":
          description: The innovation assessment has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validations:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: string
                        valid:
                          type: boolean
                        details: {}
                      required:
                        - rule
                        - valid
                      additionalProperties: false
                additionalProperties: false
        "400":
          description: Bad request.
        "401":
          description: The user is not authorized to access validation data.
        "500":
          description: An error occurred while fetching the validation data.
  /v1/ir-schema:
    get:
      operationId: v1-ir-schema-info
      description: Get current ir schema
      tags:
        - "[v1] IR Schema"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  schema:
                    type: object
                    properties: {}
                    additionalProperties: false
                required:
                  - version
                  - schema
                additionalProperties: false
        "400":
          description: Bad request
        "401":
          description: Not authorized
        "403":
          description: Forbidden
        "500":
          description: An error occurred
